<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Test Button Page</title>
    <style>
        .btn {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .c-blue {
            background-color: #3498db;
            color: white;
        }

        .c-red {
            background-color: #e74c3c;
            color: white;
        }

        input {
            display: block;
            margin: 10px auto;
            padding: 8px;
            font-size: 16px;
            width: 300px;
        }
    </style>
</head>
<body>
    
    <!-- ✅ ช่อง input ที่ต้องกรอกให้ครบ -->
    <input type="text" placeholder="ชื่อ" />

    <div class="actions modal-action">
        <div class="m-a-wrapper" style="text-align: center;">
            <button class="ui medium button PORTRAIT btn c-blue">ยืนยัน</button>
            <button class="ui medium button PORTRAIT btn c-red">ยกเลิก</button>
        </div>
    </div>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const nameInput = document.querySelector('input[placeholder="ชื่อ"]');

  if (nameInput) {
    const autoFillBtn = document.createElement("button");
    autoFillBtn.textContent = 'กรอกข้อมูล "xxxx"';
    autoFillBtn.style.marginLeft = "10px";
    autoFillBtn.className = "ui medium button c-green";

    autoFillBtn.addEventListener("click", function () {
      nameInput.value = "xxxx";
      nameInput.dispatchEvent(new Event("input", { bubbles: true }));
    });

    nameInput.parentNode.insertBefore(autoFillBtn, nameInput.nextSibling);
  }

  const confirmButton = [...document.querySelectorAll('button.c-blue')]
    .find(btn => btn.textContent.trim() === "ยืนยัน");

  if (confirmButton) {
    confirmButton.addEventListener("click", function () {
      console.log("✅ ปุ่มยืนยันถูกคลิกแล้ว");
      window.location.href = "https://google.com"; // เปลี่ยนเป็นหน้าที่คุณต้องการ
    });
  }
});
</script>
